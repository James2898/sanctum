<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 128 128"
  width="128"
  height="128"
>
  <!-- Dark squircle badge -->
  <rect width="128" height="128" rx="28" fill="#121212" />

  <!-- Torii Gate in Electric Violet (#7d42ff) -->
  <!-- Kasagi (Curved Upper Lintel) -->
  <path
    d="M 10,21 C 26,23.5 48,24.5 64,24.5 C 80,24.5 102,23.5 118,21 L 115,28.5 C 99,30.5 79,31.5 64,31.5 C 49,31.5 29,30.5 13,28.5 Z"
    fill="#7d42ff"
  />

  <!-- Shimaki (Sub-lintel) -->
  <rect x="18" y="30" width="92" height="6.5" rx="1" fill="#7d42ff" />

  <!-- Gakuzuka (Center tablet) -->
  <rect x="60" y="36.5" width="8" height="11.5" fill="#7d42ff" />

  <!-- Nuki (Penetrating Tie-Beam) -->
  <rect x="14" y="47" width="100" height="6.5" rx="1.5" fill="#7d42ff" />

  <!-- Hashira (Pillars) -->
  <rect x="26" y="30" width="10" height="72" rx="1.5" fill="#7d42ff" />
  <rect x="92" y="30" width="10" height="72" rx="1.5" fill="#7d42ff" />

  <!-- Nemaki / Daiishi (Pillar Base Pedestals) -->
  <rect x="23" y="100" width="16" height="5.5" rx="1.5" fill="#7d42ff" />
  <rect x="89" y="100" width="16" height="5.5" rx="1.5" fill="#7d42ff" />

  <!-- Framed Open Manga Pages in White (#ffffff) -->
  <!-- Book Body -->
  <path
    d="M 64,65 C 55,61.5 46,62 38,64 C 36.8,64.4 36,65.3 36,66.5 L 36,92 C 45,90 55,90.5 64,94.5 C 73,90.5 83,90 92,92 L 92,66.5 C 92,65.3 91.2,64.4 90,64 C 82,62 73,61.5 64,65 Z"
    fill="#ffffff"
  />

  <!-- Spine groove -->
  <line
    x1="64"
    y1="66"
    x2="64"
    y2="94"
    stroke="#121212"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Right page panels (Manga reading order: right side) -->
  <line
    x1="68"
    y1="76"
    x2="87"
    y2="76"
    stroke="#121212"
    stroke-width="1.8"
    stroke-linecap="round"
  />
  <line
    x1="77"
    y1="76"
    x2="77"
    y2="88"
    stroke="#121212"
    stroke-width="1.8"
    stroke-linecap="round"
  />

  <!-- Left page panels (Manga action dynamic layout) -->
  <line
    x1="41"
    y1="78"
    x2="60"
    y2="74.5"
    stroke="#121212"
    stroke-width="1.8"
    stroke-linecap="round"
  />
  <line
    x1="44"
    y1="84.5"
    x2="57"
    y2="84.5"
    stroke="#121212"
    stroke-width="1.6"
    stroke-linecap="round"
  />
</svg>
