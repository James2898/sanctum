<!doctype html>
<html>
  <head>
    <style>
      body {
        width: 350px;
        background: #0f0f0f;
        color: #efefef;
        font-family: "Segoe UI", sans-serif;
        margin: 0;
        padding: 15px;
      }
      h2 {
        font-size: 18px;
        color: #7d42ff;
        border-bottom: 1px solid #333;
        padding-bottom: 10px;
        margin-top: 0;
      }
      .series-list {
        max-height: 400px;
        overflow-y: auto;
      }
      .manga-card {
        background: #1a1a1a;
        border: 1px solid #333;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 10px;
        transition: 0.2s;
      }
      .manga-card:hover {
        border-color: #7d42ff;
        background: #222;
      }
      .manga-title {
        font-weight: bold;
        font-size: 14px;
        text-transform: capitalize;
        margin-bottom: 4px;
        display: block;
      }
      .manga-info {
        font-size: 12px;
        color: #aaa;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .btn-read {
        background: #7d42ff;
        color: white;
        text-decoration: none;
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 11px;
      }
      .status {
        font-size: 10px;
        color: #666;
        text-align: center;
        margin-top: 10px;
      }
      .btn-delete {
        color: #ff4d4d;
        background: none;
        border: none;
        font-size: 11px;
        cursor: pointer;
        padding: 0;
        margin-left: 10px;
        text-decoration: underline;
      }
      .btn-delete:hover {
        color: #ff1a1a;
      }
      .manga-actions {
        display: flex;
        align-items: center;
      }
      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <h2>🛡️ Sanctum Vault</h2>
    <div id="loading">Fetching your records...</div>
    <div id="list" class="series-list"></div>
    <div class="status" id="status">Syncing with Google Drive...</div>

    <script src="popup.js"></script>
  </body>
</html>
